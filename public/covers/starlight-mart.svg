<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="은하 저편의 24시 편의점 표지">
  <title>은하 저편의 24시 편의점</title>
  <defs>
    <linearGradient id="sm-space" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#050d16"/>
      <stop offset="40%" stop-color="#0b1c2a"/>
      <stop offset="72%" stop-color="#102b38"/>
      <stop offset="100%" stop-color="#071620"/>
    </linearGradient>
    <radialGradient id="sm-nebula" cx="72%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#7fd6c4" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#3f7f8f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7fd6c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sm-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd79a" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#ffb867" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffb867" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sm-hull" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#2b4652"/>
      <stop offset="55%" stop-color="#456a76"/>
      <stop offset="100%" stop-color="#1d333c"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#sm-space)"/>
  <rect width="400" height="600" fill="url(#sm-nebula)"/>

  <!-- 별 -->
  <g fill="#dff4f0">
    <circle cx="36" cy="52" r="1.3" opacity=".6"/>
    <circle cx="96" cy="96" r="1" opacity=".4"/>
    <circle cx="150" cy="38" r="1.6" opacity=".8"/>
    <circle cx="220" cy="74" r="1" opacity=".35"/>
    <circle cx="286" cy="42" r="1.2" opacity=".55"/>
    <circle cx="344" cy="112" r="1.4" opacity=".65"/>
    <circle cx="58" cy="176" r="1" opacity=".3"/>
    <circle cx="128" cy="212" r="1.1" opacity=".4"/>
    <circle cx="330" cy="196" r="1" opacity=".35"/>
    <circle cx="252" cy="248" r="1.3" opacity=".45"/>
    <circle cx="44" cy="300" r="1" opacity=".28"/>
    <circle cx="368" cy="312" r="1.2" opacity=".38"/>
  </g>

  <!-- 궤도 -->
  <g fill="none" stroke="#7fd6c4" opacity=".22">
    <ellipse cx="200" cy="230" rx="150" ry="52" stroke-width="1.2"/>
    <ellipse cx="200" cy="230" rx="112" ry="34" stroke-width="1" opacity=".7"/>
  </g>

  <!-- 정거장 -->
  <g>
    <ellipse cx="200" cy="236" rx="96" ry="60" fill="url(#sm-warm)"/>
    <!-- 지지대 -->
    <rect x="196" y="252" width="8" height="52" fill="#1d333c"/>
    <rect x="150" y="300" width="100" height="10" rx="5" fill="#223d47"/>
    <!-- 본체 -->
    <rect x="132" y="186" width="136" height="70" rx="14" fill="url(#sm-hull)"/>
    <rect x="132" y="186" width="136" height="70" rx="14" fill="none" stroke="#7fd6c4" stroke-width="1" opacity=".35"/>
    <!-- 창문에서 새어나오는 불빛 -->
    <g fill="#ffd79a">
      <rect x="148" y="204" width="26" height="20" rx="4" opacity=".95"/>
      <rect x="182" y="204" width="26" height="20" rx="4" opacity=".8"/>
      <rect x="216" y="204" width="26" height="20" rx="4" opacity=".92"/>
      <rect x="148" y="232" width="94" height="6" rx="3" opacity=".45"/>
    </g>
    <!-- 간판 -->
    <rect x="160" y="166" width="80" height="16" rx="8" fill="#0d2029" stroke="#7fd6c4" stroke-width="1" opacity=".9"/>
    <text x="200" y="178" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#7fd6c4" letter-spacing="1">24H OPEN</text>
    <!-- 안테나 -->
    <path d="M268 200 L300 178" stroke="#456a76" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="302" cy="176" r="4" fill="#ffd79a" opacity=".9"/>
    <path d="M132 214 L104 226" stroke="#456a76" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 바닥 빛 번짐 -->
  <ellipse cx="200" cy="330" rx="120" ry="14" fill="#ffb867" opacity=".1"/>

  <!-- 제목 -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" text-anchor="middle">
    <text x="200" y="470" font-size="14" letter-spacing="6" fill="#7fd6c4" opacity=".9">SCIENCE FICTION</text>
    <text x="200" y="512" font-size="27" font-weight="700" fill="#eaf6f4" letter-spacing="-0.5">은하 저편의</text>
    <text x="200" y="546" font-size="27" font-weight="700" fill="#eaf6f4" letter-spacing="-0.5">24시 편의점</text>
    <text x="200" y="576" font-size="13" fill="#8fa8ad">윤재하</text>
  </g>
</svg>
