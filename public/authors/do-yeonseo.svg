<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="도연서 작가 실루엣 초상">
  <title>도연서</title>
  <defs>
    <linearGradient id="dy-space" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0b2b36"/>
      <stop offset="55%" stop-color="#06202a"/>
      <stop offset="100%" stop-color="#03121a"/>
    </linearGradient>
    <radialGradient id="dy-window" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fd6c4" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#7fd6c4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7fd6c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dy-figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030f14"/>
      <stop offset="100%" stop-color="#06171f"/>
    </linearGradient>
    <clipPath id="dy-clip"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>

  <g clip-path="url(#dy-clip)">
    <rect width="200" height="200" fill="url(#dy-space)"/>

    <!-- 정거장 창 -->
    <circle cx="62" cy="60" r="52" fill="url(#dy-window)"/>
    <circle cx="62" cy="60" r="30" fill="none" stroke="#7fd6c4" stroke-width="1.6" opacity="0.5"/>
    <circle cx="62" cy="60" r="30" fill="#ffd79a" opacity="0.07"/>

    <!-- 별 -->
    <circle cx="150" cy="34" r="1.8" fill="#cfeee7" opacity="0.8"/>
    <circle cx="170" cy="66" r="1.2" fill="#cfeee7" opacity="0.6"/>
    <circle cx="132" cy="76" r="1" fill="#cfeee7" opacity="0.5"/>
    <circle cx="24" cy="112" r="1.3" fill="#cfeee7" opacity="0.45"/>

    <!-- 인물: 어깨 -->
    <path d="M30 200 C30 157 61 134 100 134 C139 134 170 157 170 200 Z" fill="url(#dy-figure)"/>
    <!-- 인물: 머리 -->
    <ellipse cx="100" cy="96" rx="29" ry="33" fill="url(#dy-figure)"/>
    <!-- 단발 머리 -->
    <path d="M69 94 C67 64 84 55 100 55 C116 55 133 64 131 94 L131 116 C127 112 126 100 124 88 C114 96 86 96 76 88 C74 100 73 112 69 116 Z" fill="#030f14"/>
    <!-- 창에서 오는 빛 -->
    <path d="M76 70 C72 78 71 88 72 98 C74 88 76 78 80 74 Z" fill="#7fd6c4" opacity="0.4"/>
    <path d="M48 158 C40 168 34 184 32 200 L41 200 C44 184 49 172 56 164 Z" fill="#7fd6c4" opacity="0.16"/>
  </g>
</svg>
