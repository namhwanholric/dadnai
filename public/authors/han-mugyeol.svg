<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="한무결 작가 실루엣 초상">
  <title>한무결</title>
  <defs>
    <linearGradient id="hm-room" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#33161a"/>
      <stop offset="55%" stop-color="#200f12"/>
      <stop offset="100%" stop-color="#100608"/>
    </linearGradient>
    <radialGradient id="hm-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e08a8a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#e08a8a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e08a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hm-figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0406"/>
      <stop offset="100%" stop-color="#17090c"/>
    </linearGradient>
    <clipPath id="hm-clip"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>

  <g clip-path="url(#hm-clip)">
    <rect width="200" height="200" fill="url(#hm-room)"/>

    <!-- 책상 위 등불 -->
    <circle cx="146" cy="58" r="48" fill="url(#hm-lamp)"/>

    <!-- 원고지 줄 -->
    <g stroke="#e08a8a" stroke-width="1" opacity="0.22">
      <line x1="112" y1="40" x2="192" y2="40"/>
      <line x1="112" y1="56" x2="192" y2="56"/>
      <line x1="112" y1="72" x2="192" y2="72"/>
      <line x1="112" y1="88" x2="192" y2="88"/>
    </g>
    <!-- 빨간 교정선 -->
    <line x1="118" y1="66" x2="186" y2="48" stroke="#e05a5a" stroke-width="2.6" opacity="0.85"/>

    <!-- 인물: 어깨 -->
    <path d="M30 200 C30 157 61 134 100 134 C139 134 170 157 170 200 Z" fill="url(#hm-figure)"/>
    <!-- 인물: 머리 -->
    <ellipse cx="98" cy="96" rx="29" ry="33" fill="url(#hm-figure)"/>
    <!-- 뒤로 넘긴 머리 + 묶은 매듭 -->
    <path d="M67 96 C65 66 82 56 98 56 C114 56 131 66 129 96 C122 78 112 70 98 70 C84 70 74 78 67 96 Z" fill="#0d0406"/>
    <circle cx="66" cy="102" r="9" fill="#0d0406"/>
    <!-- 등불 쪽 윤곽 -->
    <path d="M122 74 C128 82 129 92 128 102 C126 92 124 82 120 78 Z" fill="#e08a8a" opacity="0.42"/>
    <path d="M152 158 C161 168 167 184 169 200 L160 200 C157 184 152 172 146 165 Z" fill="#e08a8a" opacity="0.15"/>
  </g>
</svg>
