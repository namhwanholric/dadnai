<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="한무결 프로필 도형">
  <title>한무결</title>
  <defs>
    <linearGradient id="hm-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#210f11"/>
      <stop offset="100%" stop-color="#120709"/>
    </linearGradient>
    <radialGradient id="hm-glow" cx="42%" cy="34%" r="54%">
      <stop offset="0%" stop-color="#e08a8a" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#e08a8a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e08a8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#hm-bg)"/>
  <rect width="200" height="200" fill="url(#hm-glow)"/>

  <!-- 원고지 한 칸과 그 위에 그어진 교정선 -->
  <rect x="56" y="56" width="88" height="88" fill="none" stroke="#e08a8a" stroke-width="1.6" opacity="0.55"/>
  <line x1="56" y1="100" x2="144" y2="100" stroke="#e08a8a" stroke-width="0.8" opacity="0.28"/>
  <line x1="100" y1="56" x2="100" y2="144" stroke="#e08a8a" stroke-width="0.8" opacity="0.28"/>
  <line x1="42" y1="112" x2="158" y2="88" stroke="#e05a5a" stroke-width="3" opacity="0.92"/>
</svg>
