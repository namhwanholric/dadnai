name: GitHub Pages 배포

# main 에 푸시하면 정적 사이트를 빌드해서 Pages 에 올린다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 두어야 동작한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 정적 사이트 빌드
        # 프로젝트 페이지(<user>.github.io/<repo>/)는 경로 앞에 저장소 이름이 붙어야 한다.
        # 사용자 페이지나 커스텀 도메인을 쓴다면 아래 env 두 줄을 지운다.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
